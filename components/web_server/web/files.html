<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ludo001 - arquivos</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="card">
        <h1>{{DIR_TITLE}}</h1>
        {{FILE_LIST}}
    </div>
    <div class="card">
        <h2>Enviar para o SD</h2>
        <div class="upload">
            <label class="drop">
                <input type="file" id="f" class="visually-hidden" onchange="picked(this)">
                <span class="drop-icon"></span>
                <span class="drop-title">Escolher arquivo</span>
                <span class="drop-hint">Toque para escolher ou arraste um arquivo</span>
            </label>
            <button class="btn wide" onclick="up()" disabled>Enviar arquivo</button>
        </div>
        <div class="upload">
            <label class="drop">
                <input type="file" id="d" class="visually-hidden" webkitdirectory multiple onchange="picked(this)">
                <span class="drop-icon"></span>
                <span class="drop-title">Escolher pasta</span>
                <span class="drop-hint">Toque para escolher uma pasta</span>
            </label>
            <button class="btn wide" onclick="upDir()" disabled>Enviar pasta</button>
        </div>
        <div class="progress" id="progress" hidden>
            <div class="progress-fill" id="fill"></div>
        </div>
        <p id="status"></p>
    </div>
    <script src="/app.js"></script>
</body>

</html>
